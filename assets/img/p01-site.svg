<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t">
  <title id="t">上下水道工事の現場のイメージイラスト</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7f3"/>
      <stop offset="1" stop-color="#f3f7fb"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9c7650"/>
      <stop offset="1" stop-color="#6f5236"/>
    </linearGradient>
    <pattern id="stripe" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#e8762c"/>
      <rect x="10" width="10" height="20" fill="#ffffff"/>
    </pattern>
  </defs>

  <!-- 空・遠景 -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 250 Q120 205 240 232 T480 222 T800 236 V300 H0 Z" fill="#c6d5e4"/>
  <!-- 遠景の建物（特定できない簡略形） -->
  <g fill="#b3c3d4">
    <rect x="40" y="200" width="70" height="80"/>
    <rect x="120" y="222" width="54" height="58"/>
    <rect x="600" y="196" width="80" height="84"/>
    <rect x="690" y="214" width="60" height="66"/>
  </g>
  <g fill="#d7e2ee">
    <rect x="52" y="214" width="12" height="12"/><rect x="76" y="214" width="12" height="12"/>
    <rect x="52" y="238" width="12" height="12"/><rect x="76" y="238" width="12" height="12"/>
    <rect x="614" y="210" width="12" height="12"/><rect x="640" y="210" width="12" height="12"/>
    <rect x="614" y="234" width="12" height="12"/><rect x="640" y="234" width="12" height="12"/>
  </g>

  <!-- 道路 -->
  <path d="M0 280 H800 V600 H0 Z" fill="#59606a"/>
  <path d="M0 280 H800 V296 H0 Z" fill="#8b929b"/>
  <g fill="#e9edf1">
    <rect x="30" y="520" width="90" height="10" rx="2"/>
    <rect x="680" y="520" width="90" height="10" rx="2"/>
  </g>

  <!-- 掘削部（土留めあり） -->
  <path d="M190 360 H610 L640 560 H160 Z" fill="url(#soil)"/>
  <path d="M190 360 H610 V376 H190 Z" fill="#7d5c3c"/>
  <!-- 土留め板 -->
  <g fill="#4d6b8a">
    <rect x="196" y="372" width="18" height="176"/>
    <rect x="586" y="372" width="18" height="176"/>
  </g>
  <g stroke="#2f4a66" stroke-width="8" stroke-linecap="round">
    <line x1="214" y1="410" x2="586" y2="410"/>
    <line x1="214" y1="480" x2="586" y2="480"/>
  </g>
  <!-- 砕石の基礎と新しい管 -->
  <rect x="214" y="520" width="372" height="28" fill="#a9a39a"/>
  <g fill="#8f897f">
    <circle cx="240" cy="532" r="4"/><circle cx="290" cy="540" r="3"/><circle cx="350" cy="530" r="4"/>
    <circle cx="420" cy="540" r="3"/><circle cx="480" cy="532" r="4"/><circle cx="550" cy="540" r="3"/>
  </g>
  <rect x="214" y="494" width="372" height="30" rx="6" fill="#2c6aa0"/>
  <rect x="214" y="498" width="372" height="7" rx="3" fill="#6fa2d0"/>
  <rect x="392" y="490" width="20" height="38" rx="4" fill="#1e4f7c"/>

  <!-- 掘削部まわりのバリケード -->
  <g>
    <rect x="160" y="330" width="120" height="16" fill="url(#stripe)" stroke="#9a4c16" stroke-width="2"/>
    <rect x="170" y="346" width="6" height="22" fill="#6d7680"/>
    <rect x="264" y="346" width="6" height="22" fill="#6d7680"/>
    <rect x="520" y="330" width="120" height="16" fill="url(#stripe)" stroke="#9a4c16" stroke-width="2"/>
    <rect x="530" y="346" width="6" height="22" fill="#6d7680"/>
    <rect x="624" y="346" width="6" height="22" fill="#6d7680"/>
  </g>

  <!-- カラーコーン -->
  <g>
    <path d="M110 368 L126 312 L142 368 Z" fill="#e8762c"/>
    <rect x="100" y="366" width="52" height="8" rx="2" fill="#c55e1d"/>
    <rect x="118" y="332" width="16" height="7" fill="#ffffff"/>
    <path d="M660 368 L676 312 L692 368 Z" fill="#e8762c"/>
    <rect x="650" y="366" width="52" height="8" rx="2" fill="#c55e1d"/>
    <rect x="668" y="332" width="16" height="7" fill="#ffffff"/>
  </g>

  <!-- 地上に置かれた管材 -->
  <g>
    <rect x="40" y="420" width="120" height="22" rx="5" fill="#2c6aa0"/>
    <rect x="40" y="444" width="120" height="22" rx="5" fill="#2c6aa0"/>
    <rect x="52" y="432" width="120" height="22" rx="5" fill="#3b7cb5"/>
    <ellipse cx="172" cy="443" rx="6" ry="11" fill="#1e4f7c"/>
  </g>

  <!-- 小型バックホウ（簡略形） -->
  <g>
    <rect x="652" y="420" width="120" height="44" rx="6" fill="#f2c230"/>
    <rect x="690" y="384" width="60" height="44" rx="4" fill="#f2c230"/>
    <rect x="700" y="392" width="40" height="24" rx="2" fill="#cfe0f0"/>
    <rect x="644" y="462" width="136" height="26" rx="13" fill="#3a3f46"/>
    <g fill="#6d7680"><circle cx="664" cy="475" r="8"/><circle cx="712" cy="475" r="8"/><circle cx="760" cy="475" r="8"/></g>
    <path d="M660 430 L600 380 L560 400" fill="none" stroke="#d9a71f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M552 392 l-8 34 l30 -6 z" fill="#5b6168"/>
  </g>

  <!-- 作業者（掘削部の奥の地上、保護具着用） -->
  <g transform="translate(-150 -24)">
    <rect x="452" y="292" width="34" height="46" rx="8" fill="#f2c230"/>
    <rect x="452" y="310" width="34" height="5" fill="#e9edf1"/>
    <rect x="456" y="336" width="12" height="32" rx="4" fill="#2b3a52"/>
    <rect x="471" y="336" width="12" height="32" rx="4" fill="#2b3a52"/>
    <rect x="453" y="364" width="17" height="8" rx="3" fill="#24272c"/>
    <rect x="469" y="364" width="17" height="8" rx="3" fill="#24272c"/>
    <circle cx="469" cy="280" r="12" fill="#e0b48f"/>
    <path d="M454 278 a15 13 0 0 1 30 0 Z" fill="#ffffff" stroke="#c9d1da" stroke-width="2"/>
    <rect x="452" y="276" width="34" height="4" rx="2" fill="#ffffff" stroke="#c9d1da" stroke-width="1"/>
    <path d="M486 300 l20 22" stroke="#f2c230" stroke-width="10" stroke-linecap="round"/>
    <circle cx="508" cy="324" r="5" fill="#3a3f46"/>
  </g>
</svg>
